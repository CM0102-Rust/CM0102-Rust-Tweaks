# tweaks.cfg - settings for CM0102-Rust-Tweaks, the ddraw.dll for CM 01/02 3.9.68 (saves above 2 GB, regen ages,
# retiring idle players and how youth regens are distributed)
#
# Put this file next to the game exe. One setting per line: "name = value". Anything after # is a comment.
# Without this file the DLL changes nothing in the game: the switches (save_over_2gb, ages, retire_idle_players,
# rule) are off unless a line here turns them on. A missing number uses the value shown here.

# ---- Exes that are already modified ----
# Each part checks the exe before hooking in. If the exe already changes the routine that a part would replace (for
# example the Regen Tweak by xeno/Saturn, or the regen age changes in some NickPatcher exes), the part keeps the
# exe's own routine and tweaks.log says so. override_exe_changes = 1 replaces those changes with this DLL's rules
# instead. A part never hooks into an exe whose code differs where it hooks in (that would not be safe).
override_exe_changes = 0

# ---- Saves above 2 GB ----
# The save2gb fix: lets the game write and load saves above 2 GB (up to 4 GB). Without it, a save above 2 GB
# fails to load. It changes nothing in smaller saves. 1 = on (the default in this file), 0 = off (also off without the line). It's the same fix as the
# save2gb DLL; turn it on here if you use this DLL instead of that one (two ddraw.dll files can't share a folder
# unless one is renamed to ddraw_chain.dll).
save_over_2gb = 1

# ---- Game folder and the admin flag (no SetupReg, no "run as administrator") ----
# portable_folder = 1: the game normally reads its folder from the registry (the "Location" that SetupReg writes) and
# switches to it, so two installs get mixed up and a new one needs SetupReg. With this on, the game always uses the
# folder of its own exe. Nothing is written to the registry. 0 = off (the default).
portable_folder = 0
# multiple_instances = 1: the game only lets one copy run (a lock, its mutex). With this on, the lock is per folder:
# games in different folders (3.9.68 and CLZ, or two careers in two copies) can run at the same time; two from the same
# folder are still blocked, since they would share the temporary files and the save. Use it with portable_folder = 1.
# 0 = off (the default).
multiple_instances = 0
# clear_admin_flag = 1: NickDLL (CLZ and other NickPatcher packs) marks the exe "WIN95 RUNASADMIN" in Windows'
# compatibility settings every time it starts, so the game asks to run as administrator. With this on, this DLL removes
# RUNASADMIN and WIN95 for this exe only (WIN95 alone gives CLZ with clz.dll a white screen) and keeps anything else
# Windows put there. It works from the next start on. CLZ 2026 V6.1 WITHOUT clz.dll crashes when creating a career
# without Windows 95 mode: leave this off there.
# Leave it off if you set those compatibility options on purpose. 0 = off (the default).
clear_admin_flag = 0

# ---- Screen and CD (from the CM0102 project) ----
# video = window: the game draws to the project's own DirectDraw and the picture goes to an ordinary window: Print
# Screen and screen recorders work, the window can be resized (sharp scaling, black bars when the shape differs) and
# Windows' video mode never changes (no flicker on Alt+Tab). Works at 800x600. The window size is kept in janela.cfg
# next to the exe. original = the system's DirectDraw (the default).
video = original
# resolution = 1080: the project's native 1920x1080, applied in memory (the exe file is not changed). It turns on
# video = window too. Places the exe already has are kept; if any place holds another patch, nothing is changed. With
# CLZ 6.1's NickDLL set to a resolution of its own ("resolucao" in NickDLL_config.json), it is left to NickDLL.
# With resolution, video or NickDLL's resolution, the match report gets a 30-row limit per area (without it, an old
# match's report asks for more rows at high resolutions and the game stops with "Area.cpp 507"; nothing changes at
# 800x600). original = the exe's own resolution (the default).
resolution = original
# no_cd = 1: the 33 CD checks always pass, so the game runs without the CD. Check by check: those the exe already has
# are kept. Left to LaMOHatesCD.dll when it is next to the exe. 0 = off (the default).
no_cd = 0

# ---- Regen ages ----
# "Nation in the game", here and below: a nation whose league you picked when starting the career, either as a playable
# league or as a background league - for regens the game treats both the same (the nation's NationLeagueSelected byte is
# 2 for playable, 1 for background, and the regen code only checks it isn't 0). A "nation not in the game" is one
# whose league you didn't pick at all.
# ages = custom    use the age table below
# ages = original  change nothing: the game keeps the 3.9.68 ages (the default without this line)
ages = custom

# One line per age: age_NN = chance, CA cap
#   chance  relative weight of that age (they don't need to add up to 100; 0 = never)
#   CA cap  the youngster's current ability can't start above this (1 to 200); leave it out for no cap
# Ages from 14 to 35. The values below are the original game's: mostly 16 to 20, a handful at 15 and 21 to 26.
# An age without a line keeps the value shown here (ages not listed are 0); to remove an age, set its chance to 0.
age_15 = 0.0025, 80
age_16 = 16.67, 80
age_17 = 29.11, 80
age_18 = 29.11, 100
age_19 = 12.44, 110
age_20 = 12.44, 110
age_21 = 0.04
age_22 = 0.04
age_23 = 0.04
age_24 = 0.04
age_25 = 0.04
age_26 = 0.04

# Younger regens - the idea of petermf23 in his Polish divisions mod for 3.9.60 (item 14, "Younger regens"):
# a regen drawn at younger_from_age or older is made younger_by years younger (22 -> 16, 26 -> 20), so more regens get
# a proper development period. It applies after the draw, in the table above and for nations not in the game.
# younger_by = 0 turns it off.
younger_from_age = 22
younger_by = 6

# Nations not in the game with fewer than 350 people in the database draw ages differently in the original: mostly 23 to 27,
# sometimes 17 to 23, and there the age also picks the CA formula (younger = lower CA), with no cap. That's where
# the younger regens rule matters most.
# ages_out_of_game = original  keep the original draw for them, with the younger regens rule (the default)
# ages_out_of_game = table     use the table above for them too (the CA caps don't apply there)
ages_out_of_game = table

# Chance (%) that the CA cap is skipped for a youngster (the original skips it about 1 time in 200).
ca_cap_skip = 0.5

# Youngsters up to this age (from countries in the game) enter the clubs' contest 3 times in 4; older ones mostly
# start without a club. The original is 18 (under 19).
contest_max_age = 18

# Who goes to the clubs' contest. In the original, a youngster from a nation in the game goes to the contest only when
# he's under contest_max_age + 1, and then 3 times in 4; everyone else starts without a club, even when clubs in his
# country have room. This setting works with any rule and any ages setting.
# unattached = original         keep that (the default without this line)
# unattached = only_if_no_room  every youngster from a nation in the game goes to the contest, at any age (so
#                               contest_max_age no longer matters); he starts without a club only when no club there can
#                               take him (squad full, or season_cap reached with rule = new). Youngsters from nations
#                               not in the game keep the original path.
unattached = only_if_no_room

# ---- Retiring idle players ----
# Each regen is born from a retired player's record, so more retirements of players nobody wants mean more regens
# a year, with the same total number of people and no change to the save format.
# How the original game retires a player without a club (checked on days 0, 80, 173 and 250 of the year):
#   - past his position's age limit (30 for strikers and attacking midfielders, 31 for the others, 34 for
#     goalkeepers): over 34 and 65+ days without a club, he retires; there are other cases by age and reputation;
#   - otherwise, any age: 365+ days without a club and random(current reputation) < 750.
# A retired player first goes to a retirement list and, on its date, his record feeds the regen queue (a few weeks).
# retire_idle_players = 1 changes the second rule, for players only:
#   - at idle_min_age or older and idle_days+ days without a club, he retires when
#     random(current reputation) < idle_rep + idle_rep_per_year x (age - idle_min_age);
#     e.g. reputation 3000: 50% per check at 28, 75% at 31, 100% at 34;
#   - under protect_young_unemployed he never retires by this rule; 0 = no protection (the default: the original
#     already gives a clubless youngster 365 days, and protecting the young cut most of the recycling into regens);
#   - everyone else keeps the original rule. Players on any club's shortlist never retire by it, as in the original.
# Note: some NickPatcher exes (the CLZ ones) skip retirements under 34 altogether, so this rule rarely finds anyone
# there; tweaks.log says so at start-up.
retire_idle_players = 1
idle_days = 180
idle_min_age = 28
idle_rep = 1500
idle_rep_per_year = 250
protect_young_unemployed = 0
# ---- Regens ----
# How it works: when the game creates a youth regen, every eligible club in his country (not foreign there,
# not a B team, squad below the limit) gets a weight, and the club is drawn in proportion to its weight:
#
#     weight = (level x facilities x staff x room) ^ temperature
#
# A club with twice the weight has twice the chance. If no club has any weight, the youngster stays without
# a club (as in the original game).
#
# rule = new       use the rules below
# rule = original  change nothing: the game keeps the 3.9.68 rule (the default without this line)
rule = new

# ---- Level: the youngster tends to go to a club of "his size" ----
# Target reputation = target_k x (PA, or a mix of PA and CA set by target_ca). Club reputation is 0 to 10000,
# PA is 1 to 200, so target_k = 50 puts a PA 180 youngster's target at reputation 9000.
target_k = 50
# 0 = target by PA only (the level he will reach); 1 = by CA only (the level he has now); 0.3 = 70% PA, 30% CA.
target_ca = 0
# Width of the bell curve around the target, in reputation points. A club this far from the target keeps
# 61% of the level weight; twice this far, 14%. Smaller = fewer surprises.
sigma = 2500
# The width for clubs SMALLER than the target. Narrower than sigma on purpose: a country has hundreds of small
# clubs, and with the same width they would add up and take most of the good youngsters. With 1200, a club 2400
# below the target keeps 14%; one 2400 above keeps 63%. 0 = the same as sigma.
sigma_below = 1200
# Minimum level weight (0 to 1) for a club far from the target. Keep it small: a country has hundreds of
# small clubs, and a small floor added over all of them becomes the biggest slice of the draw.
level_floor = 0.002

# ---- Facilities: the club's Training (1 to 20) ----
# facilities = facilities_base + facilities_k x Training. With 0.4 and 0.06: Training 1 = 0.46,
# Training 10 = 1.0, Training 20 = 1.6 (no jump between 19 and 20, unlike the original).
facilities_base = 0.4
facilities_k = 0.06

# ---- Staff: the best "Working with Youngsters" among the manager and the coaches ----
# Goes from staff_min (attribute 1) to staff_max (attribute 20). Counts the same for AI and human clubs.
staff_min = 0.8
staff_max = 1.2

# ---- Room in the squad ----
# room = ((squad_limit - squad size) / squad_limit) ^ squad_exp. A club with squad_limit players or more
# doesn't take part. squad_limit goes up to 50 (the game's squad size); the Regen Tweak uses 45, and 48 leaves the big
# squads in the contest while season_cap does the braking.
# With the intake on, room doesn't weigh: the intake's quota is the limit.
squad_limit = 48
squad_exp = 0.5

# ---- Cap per club ----
# A club that already got this many regens in the last 365 days doesn't take part. 0 = no cap. With the intake on it
#   doesn't apply: the intake's quota is the limit.
season_cap = 2

# ---- Surprise ----
# Share (%) of youngsters drawn ignoring the level: only clubs that play in a competition running in the game take
# part, still weighted by facilities, staff and room. It's the gem born at a small club (Ronaldo started at
# Sao Cristovao); the transfer market takes him further later. 0 = off.
surprise = 15
# Clubs outside the competitions that run in your career (their division isn't played, not even as background): their
# weight in the contest is multiplied by this. 1 = the same as any other club (the default); 0.25 = a quarter; 0 = never
# (if no club in a running competition has room, the youngster stays without a club). Lower values keep the squads
# of the leagues you play fuller; with few leagues loaded, most of a country's clubs are outside, so 1 may suit better.
outside_competitions = 1

# ---- Randomness ----
# Exponent on the weight. 1 = plain proportional draw; 2 = more predictable (the best-fitting clubs win more
# often); 0.5 = more random.
temperature = 1

# ---- Where each regen comes from ----
# regen_origins = 1: writes regen_origins.csv next to the exe, one line per regen born: his name, age, position, PA, CA
# and the club that won the contest (or no club), and whom he inherited from: the slot (id and personality, the person
# at the front of the retirement queue) and the player record (PA, positions, feet, nation and attributes: a retired
# player), with that player's name, age, CA and PA at retirement. Each line has the game date, the computer's date and
# the career (the save loaded or saved last; "new career" before the first save). The game itself keeps this nowhere,
# so only regens created with this on are recorded. The configurator can search it and clear it. 0 = off (the default).
regen_origins = 0

# ---- Regen names ----
# The names of new people (regens, new staff, referees) come from the database (first_names.dat, second_names.dat).
# The original uses a nation's own names only when it has more than 100 of them; with 100 or fewer it borrows from
# another nation of its language group, or from the whole world's table, which gives regens names from other countries.
# In the October 2026 data update, 100 of 231 nations still borrow, most of them with 20 to 100 names of their own.
# regen_names = own: a nation with regen_names_min or more names (default 20) uses its own, drawn as the original does
#   above 100 (the more common names come out more often). With fewer, the original's borrowing stays, except that
#   nations of language group 0 no longer take a first name from the surnames table (a bug of the original).
#   It applies to people created from then on, in a career already under way too.
# regen_names = original: the game's own rule (the default).
regen_names = own
regen_names_min = 20

# ---- Grey players ----
# Before every match (and when you open a club's squad) the game tops up short squads with "virtual" players, the ones
# shown in grey that nobody can sign. The original gives them an ability (CA) from the club's reputation that drops
# fast below 5000 (reputation / 25 - 100: zero at 2500, negative below), then takes another 30 to 70 off when the club
# is in a league you loaded and again for a reserve. In a test career (England loaded, to September 2001) 63% of the
# grey players got a negative CA, which the match engine reads as the weakest possible player.
# grey_players = squad: the CA of each grey player is the club's level, give or take half of grey_players_spread (10 =
#   from 5 below to 5 above, so on average the level itself). The level
#   is the higher of: the club's own squad (the average CA of its 16 best real players, when it has 5 or more) and its
#   reputation, by the original's upper formula used for any reputation (reputation x 0.016 + 20; national teams
#   reputation / 100 + 40), with no drop and nothing negative. The reputation keeps a big club from a league you did not
#   load strong even when the database has few of its players. The same club still gets the same grey players (names
#   and attributes); only the CA changes.
# grey_players = original: the game's own formula (the default).
grey_players = squad
grey_players_spread = 10

# ---- Regen intake ----
# FM's Youth Intake. A regen is a regen: the intake changes only two things, and everything else is the Regens section
# above (rule, level, facilities, staff, surprise, temperature, the ages and the names):
# - the date: regens are only born on intake day (whoever retires waits in the game's queue until then);
# - the number: every club with squad room gets intake_per_club regens per intake (with 2 places, 2; with none, none,
#   and your club gets a message saying so). Room is counted on the day: release players up to the day before.
# On the day, each nation's regens (the retired players', the free ones up to 21 and, when retirements aren't enough,
# new ones, made from people the DLL creates with the career and a record mixed from two of the nation's retired players
# of the same position) are handed out from the highest PA down, each drawn by the Regens curve among the clubs that still
# have a place in their quota. Regens left over once every quota is full go to the nation's normal contest.
# WITH THE INTAKE ON, season_cap AND squad_limit DON'T APPLY: the quota is the limit. Only in a NEW career.
# intake = 1: on (the default). 0 = off (the game's regens through the season, as always).
intake = 1
# intake_per_club: the regens per club per intake (1 to 20), limited to the room in the squad (50).
intake_per_club = 3
# intake_day: season_end (the default): each nation at the end of its own season (the 35 nations of the game's
#   key-nation table; the others on day 181). Or a day of the year for everyone (0 to 365, counted from 0 = 1 January;
#   181 = 1 July).
intake_day = season_end
# intake_clubs = playable: the clubs of the playable leagues; selected: the background leagues too. The nations left out
#   follow the game's original path.
intake_clubs = playable
# intake_news = 1: on intake day your club gets an inbox message from the youth coach with the youngsters who arrived
#   and his view of each one (how ready he is compared with your squad, and his potential), or that nobody could come
#   for lack of room, in the game's language. 0 = no message. The phrases are in intake_news.txt, next to the exe, one
#   section per game language: edit or translate them there.
intake_news = 1
# intake_news_numbers = 1: the message also shows each youngster's CA and PA. 0 = only the coach's view (the default).
intake_news_numbers = 0
# retire_day: the day of the year (0 to 365) every player retirement set from then on happens on, or original (the
#   game's own dates, usually the country's season end). With or without the intake.
retire_day = original

# ---- Attendance and stadium (docs/REPUTACAO_E_PUBLICO.en.md) ----
# Attendance is the support x the moment x the match: it grows with what happens on the pitch and cools when the team
# is back to what was expected. A club that finishes where it was predicted keeps its crowd; a club that does better
# grows; a club that does worse only loses what it gained by these rules, never going below what the original game
# would give. With no tweaks.cfg at all, nothing changes; a key missing from this file takes our rule.
# attendance = on: our attendance rules (the keys below up to title_race_top2); off = the original game.
attendance = on
# The season average, at the end of each league season:
# attendance_toward_real: how far (%) the average moves towards the crowd that really came that season. 50 = half way.
attendance_toward_real = 50
# attendance_per_place: how much (%) each place above or below the prediction adds or takes. 3 = 4 places above, +12%.
attendance_per_place = 3
# tradition_per_place: for clubs finishing 2 or more places above the prediction, how much (%) of the distance to the
#   club's biggest historical crowd comes back per place. 2.5 = 5 places above, 12.5% of the distance.
tradition_per_place = 2.5
# attendance_floor = on: a club doing badly loses what it gained by these rules, never going below the average the
#   original game would give it (worked out every season and kept next to the save, in a .publico file).
attendance_floor = on
# attendance_cap_weak / _mid / _strong: the most the season average can reach, in people per point of the division's
#   level (divisions of level up to 7, 8 to 12, above 12). 0 = no cap. The original: 2000, 3000 and 5000.
attendance_cap_weak = 0
attendance_cap_mid = 0
attendance_cap_strong = 0
# Each match:
# weak_league_limit: in divisions of level 4 or lower, a match crowd above this many people per level point is cut.
#   0 = no cut. The original: 1500.  weak_league_keep: how much (%) of the crowd above the limit stays (original 20).
weak_league_limit = 0
weak_league_keep = 20
# attendance_record = real: the club's record (the ceiling of an ordinary match) becomes the largest crowd that really
#   came. fixed = the database's record, which only a title or a promotion raises (the original).
attendance_record = real
# pent_up_demand: how much (%) of the people left out of a match (more wanted to come than the record allowed) becomes a
#   new record. 10 = 10,000 people left out raise the ceiling by 1,000. 0 = the original.
pent_up_demand = 10
# knockout_ceiling = stadium: in knockout rounds (cups, continental) only the stadium limits the crowd. record = the
#   club's record, as in an ordinary match (the original).
knockout_ceiling = stadium
# title_race = on: a league match between two clubs that can still be champions draws more people. title_race_max: how
#   much more (%) in the last round (it grows through the season); title_race_top2: how much more (%) when they are 1st
#   and 2nd. 50 and 25 = up to 75% more; a derby (the game's 50% more) on top of that.
title_race = on
title_race_max = 50
title_race_top2 = 25
# stadium = on: our stadium rules (the stadium_ keys below); off = the original game.
stadium = on
# stadium_seating_growth = off: converting standing places into seats no longer adds to the capacity (in the original,
#   a stadium with standing room grows every year on its own, even empty). on = the original.
stadium_seating_growth = off
# stadium_reputation_trigger = off: a stadium no longer expands only because the club's reputation is high (the
#   original expands when reputation x 2 is above the capacity, even with no crowd). on = the original.
stadium_reputation_trigger = off
# stadium_occupancy_min: the occupancy (%) a season needs to count as full. The original: 92.
stadium_occupancy_min = 92
# stadium_full_seasons: full seasons in a row (1 to 10) before a club can expand. The original: 1.
stadium_full_seasons = 2
# stadium_occupancy = all: occupancy counts every home match (league, cups, continental). league = only the league
#   (the original).
stadium_occupancy = all
# stadium_reserve: the money a club keeps untouched; a build only uses the balance above it. The original: 5250000.
stadium_reserve = 5250000
# stadium_size = demand: the new places are what the measured demand asks for, up to the ceiling. original = 21,000
#   places with a balance above 20 million (16,000 for professional clubs), or what the balance allows.
stadium_size = demand
# stadium_seat_cost: the cost of each new place, in the database's money. auto = 1,500 in the 2001 database (a real
#   build of the time cost 1,000 to 3,500 pounds a place), scaled by the median balance of the clubs with reputation
#   8,000+ in the database you play (15.4 million in 2001; 56 million in CLZ 6.1, which gives about 5,450). A number
#   fixes the cost per place. original = the game's (about 100 a place; 875 for professional clubs).
stadium_seat_cost = auto
# stadium_ceiling_zero = demand: a stadium with no expansion ceiling in the database (most of them) gets the capacity
#   plus the measured demand as its ceiling. original = the ceiling rises 1,500 a year below 30,000 places.
stadium_ceiling_zero = demand
# stadium_max: the largest capacity that can still expand (the game's own limit is 125,000).
stadium_max = 125000

# ---- Loans (docs/EMPRESTIMOS.en.md) ----
# The AI club lends whoever is spare: a youngster who isn't first team goes where he plays, a squad player goes when the
# squad has cover, a player abroad can go back home. A Key player never goes. Your club's decisions stay yours.
# loans = on: our loan rules (the loan_ keys below); off = the original game.
loans = on
# Who goes, on the lending side (the owner decides on every loan request):
# loan_youth_age: up to this age, a player who isn't a Key player counts as a youngster (goes out to play).
loan_youth_age = 21
# loan_youth_top / loan_others_top: the player only goes to a club where he would be among the top N of his line
#   (goalkeeper, defence, midfield, attack) by CA: playing time. 2 = first or second choice.
loan_youth_top = 2
loan_others_top = 2
# loan_training_margin: a youngster (not going home) only goes to a club whose Training is at least the owner's minus
#   this. 3 = up to 3 points worse. 0 = only equal or better.
loan_training_margin = 3
# loan_cover_regular / loan_cover_backup: how many players of the same line, with CA of at least loan_cover_ratio % of
#   his, the owner must keep to lend a Regular starter / a rotation or backup player. A youngster needs no cover. A loan
#   back home needs one less.
loan_cover_regular = 2
loan_cover_backup = 1
loan_cover_ratio = 90
# loan_squad_min: the owner doesn't lend (nor list) with this many players or fewer at the club. Without it a club can
#   lend until it can't field a team (the game stops with "Only 10 away players").
loan_squad_min = 20
# The asking side:
# loan_request_willingness: how willing (0 to 10) a player must be for an AI club to ask for him. The original: 3.5.
loan_request_willingness = 2.75
# loan_requests: how many more loan requests the AI makes, times the original (1, 2, 4, 8...). The original: 1.
loan_requests = 2
# loan_home: a player abroad is this many times more willing to go on loan to a club of his own nation. The original: 1.
loan_home = 2
# loan_playing_time: a player is this many times more willing to go on loan where he'd be first or second choice.
#   The original: 1.
loan_playing_time = 1.3
# loan_youth_demand: when an AI club picks a loan target, a youngster who would be among loan_youth_top of his line
#   there (and goes home, or to Training within loan_training_margin) scores this many times more. The original: 1.
loan_youth_demand = 3
# The blocked starter (a Key player or a Regular starter whom a bigger club asks for, and the owner refuses):
# loan_unhappiness: how much of his contract happiness (-100 to 100) he loses. 0 = the original (nothing happens).
# loan_unhappiness_gap: how much bigger (in reputation, 0 to 10,000) the asking club must be. With 1000, a 6000 club's
#   starter asked for by a club of 7000 or more.
loan_unhappiness = 30
loan_unhappiness_gap = 1000

# ---- Transfer budget ----
# budget_caps = off: no nation's transfer budget is compressed. In the original, Germany, France, Scotland and the
#   Netherlands keep only 25% of the budget above 17.5 million, and Brazil, the Nordic nations and others only part of
#   it above 2.5 million (England, Spain and Italy have no cap). original = the game's caps.
budget_caps = off

# ---- Game fix ----
# squad_guard = 1: a person is never kept twice in a club's squad. The game can put a player in a squad he is already
#   in (seen when it moves players between a club and its B team); the copies pile up until the automatic team
#   selection puts the same player in two positions and shows the "match_man.cpp 1225" box. The guard removes the
#   repeated copy after every squad entry, before every team selection and when a save is loaded (it also cleans old
#   saves). Each copy removed goes to tweaks.log. 0 = the original.
squad_guard = 1

# ---- Log ----
# log = 1 writes what happens to tweaks.log, one line per event, tab-separated:
#   tick    once per game month: the game date, seconds since start, and how many contest, birth and idle lines so far; "arse" if the career was
#           created with the ARSE line in player_setup.cfg (everyone has the regen bit, see README)
#           (shows the career is moving even when no tweak writes anything, e.g. override_exe_changes = 0)
#   grey    each grey player made (grey_players = squad): date, club, reputation, where the level came from (squad or
#           reputation), the level, the original CA and the new one
#   regen   each youngster of the clubs' contest: the rule (new, original or exe), date, age, PA, CA, the club's
#           reputation, Training, squad size and name, and (new rule) his chance, how many clubs took part, surprise
#   birth   each regen born through the age table: date, age, PA
#   idle    each retirement by the idle rule: date, age, reputation, days without a club
#   check   after the exe's DLLs load: whether every hook is still in place
#   crash   the first access violations: address, registers and stack, before the game goes down
#   hang    the game date stuck for 60 s: where the game is
#   season  every July: the population (players, clubless, squads, regens, the club with most regens and how many the
#           contest gave it, PA 150+)
#   intake  each intake: clubs, regens born and created, missing quotas, the reserve left (intake-diag, intake-missing,
#           intake-why and intake-extra: the reasons, for diagnosis)
#   msgbox  every game message box (the game's errors), and msgbox-detail with the text the game built before it
# With rule = original (or a contest kept by the exe), log = 1 still records the game's own picks, for comparison.
# 0 = only the start-up lines.
log = 0
