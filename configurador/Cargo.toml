[package]
name = "configurador"
version = "0.1.0"
edition = "2021"
description = "CM0102-Rust-Tweaks: o configurador do tweaks.cfg (um exe só)"
publish = false

[[bin]]
name = "tweaks-config"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
rfd = { version = "0.15", default-features = false }

[profile.release]
opt-level = 2
