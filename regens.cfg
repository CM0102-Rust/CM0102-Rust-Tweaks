# regens.cfg - settings for the CM 01/02 3.9.68 ddraw.dll: saves above 2 GB and how youth regens are distributed
#
# Put this file next to the game exe. One setting per line: "name = value". Anything after # is a comment.
# A missing file or a missing line uses the default shown here.

# ---- Saves above 2 GB ----
# The save2gb fix: lets the game write and load saves above 2 GB (up to 4 GB). Without it, a save above 2 GB
# fails to load. It changes nothing in smaller saves. 1 = on, 0 = off.
save_over_2gb = 1

# ---- Regens ----
# How it works: when the game creates a youth regen, every eligible club in his country (not foreign there,
# not a B team, squad below the limit) gets a weight, and the club is drawn in proportion to its weight:
#
#     weight = (level x facilities x staff x room) ^ temperature
#
# A club with twice the weight has twice the chance. If no club has any weight, the youngster stays without
# a club (as in the original game).
#
# rule = new       use the rules below
# rule = original  change nothing: the game keeps the 3.9.68 rule
rule = new

# ---- Level: the youngster tends to go to a club of "his size" ----
# Target reputation = target_k x (PA, or a mix of PA and CA set by target_ca). Club reputation is 0 to 10000,
# PA is 1 to 200, so target_k = 50 puts a PA 180 youngster's target at reputation 9000.
target_k = 50
# 0 = target by PA only (the level he will reach); 1 = by CA only (the level he has now); 0.3 = 70% PA, 30% CA.
target_ca = 0
# Width of the bell curve around the target, in reputation points. A club this far from the target keeps
# 61% of the level weight; twice this far, 14%. Smaller = fewer surprises.
sigma = 1500
# Minimum level weight (0 to 1) for a club far from the target. Keep it small: a country has hundreds of
# small clubs, and a small floor added over all of them becomes the biggest slice of the draw.
level_floor = 0.002

# ---- Facilities: the club's Training (1 to 20) ----
# facilities = facilities_base + facilities_k x Training. With 0.5 and 0.05: Training 1 = 0.55,
# Training 10 = 1.0, Training 20 = 1.5 (no jump between 19 and 20, unlike the original).
facilities_base = 0.5
facilities_k = 0.05

# ---- Staff: the best "Working with Youngsters" among the manager and the coaches ----
# Goes from staff_min (attribute 1) to staff_max (attribute 20). Counts the same for AI and human clubs.
staff_min = 0.8
staff_max = 1.2

# ---- Room in the squad ----
# room = ((squad_limit - squad size) / squad_limit) ^ squad_exp. A club with squad_limit players or more
# doesn't take part. squad_limit goes up to 50 (the game's squad size).
squad_limit = 50
squad_exp = 0.5

# ---- Cap per club ----
# A club that already got this many regens in the last 365 days doesn't take part. 0 = no cap.
season_cap = 3

# ---- Randomness ----
# Exponent on the weight. 1 = plain proportional draw; 2 = more predictable (the best-fitting clubs win more
# often); 0.5 = more random.
temperature = 1

# ---- Log ----
# log = 1 writes every pick to regens.log (youngster's PA and CA, chosen club, its chance, how many clubs
# took part). 0 = only the start-up line.
log = 0
